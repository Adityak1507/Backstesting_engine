[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "A small event-driven backtesting engine for trading strategies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
